  - name: news_en
    label: News & Updates (English)
    label_singular: article
    folder: src/content/news/en
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    summary: "{{title}} ({{date}}){{published | ternary(, - DRAFT)}}"
    sortable_fields:
      - date
      - title
    fields: &a1
      - name: title
        label: Title
        widget: string
      - name: slug
        label: Web address name
        widget: string
        hint: English lowercase letters, numbers and hyphens only, e.g. new-year-schedule. Use the SAME name for the English and Thai versions so the language switch links them.
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Use lowercase English letters, numbers and hyphens only
      - name: date
        label: Date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - name: published
        label: Publish on website
        widget: boolean
        default: false
        hint: Off = draft (hidden from visitors). Turn on and save to publish.
      - name: summary
        label: Short summary
        widget: text
        hint: Shown on the news list and in search results.
      - name: image
        label: Cover image
        widget: image
        required: false
      - name: seo_description
        label: Page description for Google
        widget: string
        required: false
      - name: body
        label: Article
        widget: markdown
  - name: news_th
    label: News & Updates (Thai)
    label_singular: article
    folder: src/content/news/th
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    summary: "{{title}} ({{date}}){{published | ternary(, - DRAFT)}}"
    sortable_fields:
      - date
      - title
    fields: *a1
  - name: settings
    label: Site settings
    files:
      - name: site
        label: General
        file: src/data/settings.json
        fields:
          - name: site_name
            label: Company name (English)
            widget: string
          - name: site_name_th
            label: Company name (Thai)
            widget: string
          - name: default_og_image
            label: Default social sharing image
            widget: image
            required: false
            hint: Shown when pages are shared on social media. 1200 × 630 px.
          - name: en
            label: English
            widget: object
            collapsed: false
            fields:
              - name: tagline
                label: Footer tagline
                widget: string
              - name: footer_note
                label: Copyright line (year is added automatically)
                widget: string
          - name: th
            label: ไทย (Thai)
            widget: object
            collapsed: true
            fields:
              - name: tagline
                label: Footer tagline
                widget: string
              - name: footer_note
                label: Copyright line (year is added automatically)
                widget: string
